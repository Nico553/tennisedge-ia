name: Actualizar resultados de tenis

on:
  schedule:
    - cron: '17 10 * * *'   # todos los días ~07:17 hora de Chile
  workflow_dispatch: {}      # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tennisedge-ia-v5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "pandas>=2.1,<3.0" "numpy>=1.26,<3.0" "requests>=2.31,<3.0"
      - name: Descargar resultados (máx. 40 llamadas)
        env:
          RAPIDAPI_TENNIS_KEY: ${{ secrets.RAPIDAPI_TENNIS_KEY }}
        run: python scripts/update_results.py --budget 40
      - name: Guardar en el repositorio
        run: |
          git config user.name "tennisedge-bot"
          git config user.email "tennisedge-bot@users.noreply.github.com"
          git add data/recent_results.csv data/recent_progress.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Sin cambios"; else git commit -m "Resultados recientes $(date -u +%F)" && git push; fi
